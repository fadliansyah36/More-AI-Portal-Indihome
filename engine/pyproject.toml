[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moreai-engine"
version = "0.1.0"
requires-python = ">=3.12"
description = "MoreAI agent, orchestration, tools and LLM runtime contracts"

[tool.setuptools.packages.find]
include = ["engine*"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Canonical OpenFuse browser runtime.
# The browser worker has no external network interface; only the authenticated
# MoreAI egress proxy bridges the isolated network to the public internet.
services:
  browser-supervisor:
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile.openfuse
    environment:
      WORKER_TOKEN: ${MOREAI_BROWSER_SERVICE_TOKEN:?set 32+ character worker token}
      WORKER_DATA_DIR: /data/browser-profiles
      WORKER_HOST: 0.0.0.0
      MOREAI_BROWSER_UPSTREAM_PROXY_URL: http://browser-egress-proxy:3128
      MOREAI_BROWSER_PROXY_TOKEN: ${MOREAI_BROWSER_PROXY_TOKEN:?set 32+ character proxy token}
    volumes:
      - openfuse_browser_profiles:/data/browser-profiles
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    networks: [browser_isolated]
    depends_on: [browser-egress-proxy, clamav]
    # No published port. Trusted worker uses http://browser-supervisor:8790.

  browser-egress-proxy:
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile.browser
    command: ["python", "-m", "app.proxy_main"]
    environment:
      MOREAI_BROWSER_ALLOWED_DOMAINS: ${MOREAI_BROWSER_ALLOWED_DOMAINS:?set exact allowlisted domains}
      MOREAI_BROWSER_PROXY_TOKEN: ${MOREAI_BROWSER_PROXY_TOKEN:?set 32+ character proxy token}
      MOREAI_BROWSER_PROXY_HOST: 0.0.0.0
      MOREAI_BROWSER_PROXY_PORT: "3128"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    networks: [browser_isolated, browser_egress]

  clamav:
    image: ${MOREAI_CLAMAV_IMAGE:?set an immutable digest-pinned ClamAV image}
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [browser_isolated, browser_egress]
    # No published port. Only the browser worker can reach clamd on 3310.

volumes:
  openfuse_browser_profiles:
  clamav_db:

networks:
  browser_isolated:
    internal: true
  browser_egress:
    driver: bridge

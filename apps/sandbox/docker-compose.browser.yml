# Canonical isolated browser runtime. Run from repository root with:
# docker compose -f apps/sandbox/compose.browser.yml up -d
services:
  browser-supervisor:
    build:
      context: .
      dockerfile: Dockerfile.browser
    environment:
      MOREAI_BROWSER_ALLOWED_DOMAINS: ${MOREAI_BROWSER_ALLOWED_DOMAINS:?set exact allowlisted domains}
      MOREAI_BROWSER_SERVICE_TOKEN: ${MOREAI_BROWSER_SERVICE_TOKEN:?set 32+ character service token}
      MOREAI_BROWSER_PROXY_URL: http://browser-egress-proxy:3128
      MOREAI_BROWSER_PROXY_TOKEN: ${MOREAI_BROWSER_PROXY_TOKEN:?set 32+ character proxy token}
      MOREAI_BROWSER_EGRESS_ENFORCED: "true"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    networks: [browser_isolated]
    depends_on: [browser-egress-proxy]
    # No published port: attach only the trusted worker to browser_isolated.

  browser-egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.browser
    command: ["python","-m","app.proxy_main"]
    environment:
      MOREAI_BROWSER_ALLOWED_DOMAINS: ${MOREAI_BROWSER_ALLOWED_DOMAINS:?set exact allowlisted domains}
      MOREAI_BROWSER_PROXY_TOKEN: ${MOREAI_BROWSER_PROXY_TOKEN:?set 32+ character proxy token}
      MOREAI_BROWSER_PROXY_HOST: 0.0.0.0
      MOREAI_BROWSER_PROXY_PORT: "3128"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    networks: [browser_isolated, browser_egress]

networks:
  browser_isolated:
    internal: true
  browser_egress:
    driver: bridge

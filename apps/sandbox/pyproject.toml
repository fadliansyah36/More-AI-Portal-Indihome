[project]
name = "moreai-sandbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.25.3"]
browser = ["playwright==1.51.0", "fastapi==0.115.12", "uvicorn==0.34.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "moreai-api"
version = "0.2.0"
requires-python = ">=3.12"
description = "MoreAI trusted FastAPI boundary"
dependencies = ["fastapi==0.115.12", "httpx==0.28.1", "uvicorn[standard]==0.34.0"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["api*"]

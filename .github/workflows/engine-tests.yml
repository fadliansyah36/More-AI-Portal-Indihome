name: Engine Contract Tests

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -e 'engine[test]'
      - name: Run engine contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q engine/tests

name: MoreAI PostgreSQL AST Reconstruction

on:
  push:
    branches: [main]
    paths:
      - "tools/schema_reconciliation/**"
      - "supabase/migrations/**"
      - "docs/implementation/migration-history-sql-source-snapshot-20261118/**"
      - "docs/implementation/migration-history-archive/**"
      - "docs/implementation/migration-history-statement-hashes-20261118.json"
      - ".github/workflows/**"
      - "docs/implementation/migration-source-archive/**"
      - "docs/implementation/observed-catalog-snapshot-20261118.json"
      - "docs/implementation/observed-security-catalog-snapshot-20261118.json"
      - "docs/implementation/observed-dependency-graph-20261118.json"
  workflow_dispatch:

concurrency:
  group: moreai-schema-ast-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-expected-object-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/schema_reconciliation/pyproject.toml

      - name: Install pinned PostgreSQL AST parser
        run: python -m pip install --disable-pip-version-check -e ./tools/schema_reconciliation

      - name: Run focused PostgreSQL AST reducer tests
        run: python -m unittest discover -s tools/schema_reconciliation/tests -v

      - name: Parse active migrations and recorded history
        run: |
          mkdir -p artifacts
          python tools/schema_reconciliation/schema_graph.py \
            --migrations-dir supabase/migrations \
            --history-dir docs/implementation/migration-history-sql-source-snapshot-20261118 \
            --archive-dir docs/implementation/migration-source-archive \
            --history-hash-manifest docs/implementation/migration-history-statement-hashes-20261118.json \
            --history-archive-dir docs/implementation/migration-history-archive \
            --output artifacts/expected-object-graph.json

      - name: Reconcile expected graph against read-only catalog snapshots
        run: |
          python tools/schema_reconciliation/reconcile.py \
            --expected artifacts/expected-object-graph.json \
            --observed docs/implementation/observed-catalog-snapshot-20261118.json \
            --security docs/implementation/observed-security-catalog-snapshot-20261118.json \
            --dependencies docs/implementation/observed-dependency-graph-20261118.json \
            --output artifacts/semantic-reconciliation.json

      - name: Write parse coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/expected-object-graph.json")
          if not p.exists():
              summary = {"graph_generation_status": "FAILED_BEFORE_GRAPH_OUTPUT"}
              Path("artifacts/semantic-reconciliation-summary.json").write_text(json.dumps(summary, indent=2) + "\\n")
              with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("## PostgreSQL AST reconstruction\\n\\n- **graph_generation_status**: FAILED_BEFORE_GRAPH_OUTPUT\\n")
              raise SystemExit("AST graph output missing; see the focused parser/reducer step above")
          graph = json.loads(p.read_text())
          summary = {
              "graph_generation_status": "SUCCEEDED",
              "execution_provenance_status": graph.get("execution_provenance_status"),
              "execution_provenance_reason": graph.get("execution_provenance_reason"),
              "migration_lineage_object_count": sum(1 for item in graph.get("objects", []) if item.get("migration_lineage")),
              "active_migration_file_count": graph["active_migration_file_count"],
              "history_migration_record_count": graph["history_migration_record_count"],
              "history_archive_record_count": graph["history_archive_record_count"],
              "history_hash_manifest_migration_count": graph["history_hash_manifest_migration_count"],
              "history_statement_hash_mismatch_count": graph["history_statement_hash_mismatch_count"],
              "history_statement_hash_not_verifiable_count": graph["history_statement_hash_not_verifiable_count"],
              "history_archive_statement_hash_variant_count": graph["history_archive_statement_hash_variant_count"],
              "history_archive_statement_hash_not_verifiable_count": graph["history_archive_statement_hash_not_verifiable_count"],
              "archive_source_file_count": graph["archive_source_file_count"],
              "archive_ddl_event_count": graph["archive_ddl_event_count"],
              "history_statement_source_count": graph["history_statement_source_count"],
              "source_record_count": graph["source_record_count"],
              "parsed_source_record_count": graph["parsed_source_record_count"],
              "parse_failure_count": graph["parse_failure_count"],
              "statement_count": graph["statement_count"],
              "ddl_event_count": graph["ddl_event_count"],
              "object_key_count": graph["object_key_count"],
          }
          from collections import Counter
          class_counts = Counter(item.get("object_class", "UNKNOWN") for item in graph.get("objects", []))
          summary["expected_object_class_counts"] = dict(sorted(class_counts.items()))
          reduction_counts = Counter(
              item.get("semantic_reduction_status", "NOT_REDUCED")
              for item in graph.get("objects", [])
              if item.get("semantic_reduction_status") not in (None, "NOT_APPLICABLE")
          )
          summary["semantic_reduction_status_counts"] = dict(sorted(reduction_counts.items()))
          summary["parse_failure_samples"] = graph.get("parse_failures", [])[:25]
          reconciliation_path = Path("artifacts/semantic-reconciliation.json")
          if reconciliation_path.exists():
              reconciliation = json.loads(reconciliation_path.read_text())
              summary["reconciled_object_count"] = reconciliation["object_count"]
              summary["classification_counts"] = reconciliation["classification_counts"]
              summary["global_no_drift_claim"] = reconciliation["global_no_drift_claim"]
              summary["dependency_binding_status_counts"] = dict(sorted(Counter(
                  (item.get("dependency_evidence") or {}).get("comparison_status", "NOT_REPORTED")
                  for item in reconciliation.get("objects", [])
              ).items()))
              rows = reconciliation.get("objects", [])
              missing = [item for item in rows if item.get("classification") == "MISSING"]
              unverified = [item for item in rows if item.get("classification") == "NOT_VERIFIABLE"]
              summary["missing_object_class_counts"] = dict(sorted(Counter(item.get("object_class", "UNKNOWN") for item in missing).items()))
              summary["not_verifiable_reason_counts"] = dict(sorted(Counter(item.get("reason", "UNSPECIFIED") for item in unverified).items()))
              summary["missing_samples"] = [{key: item.get(key) for key in ("object_key", "object_class", "latest_migration_id", "latest_operation", "reason")} for item in missing[:100]]
              summary["not_verifiable_samples"] = [{key: item.get(key) for key in ("object_key", "object_class", "latest_migration_id", "latest_operation", "reason")} for item in unverified[:30]]
              summary["mismatch_samples"] = [{key: item.get(key) for key in ("object_key", "object_class", "classification", "latest_migration_id", "reason")} for item in rows if item.get("classification") in {"DEFINITION_MISMATCH", "SECURITY_MISMATCH", "DEPENDENCY_MISMATCH", "UNEXPECTED"}][:100]
          Path("artifacts/semantic-reconciliation-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## PostgreSQL AST reconstruction\n\n")
              for key, value in summary.items():
                  f.write(f"- **{key}**: {value}\n")
              f.write("\nParse failures and unresolved object states are preserved in the graph as NOT_VERIFIABLE.\n")
          PY

      - name: Persist generated semantic graph and reconciliation on main
        if: success()
        continue-on-error: true
        run: |
          mkdir -p docs/implementation/generated
          cp artifacts/expected-object-graph.json docs/implementation/generated/expected-object-graph.json
          cp artifacts/semantic-reconciliation.json docs/implementation/generated/semantic-reconciliation.json
          cp artifacts/semantic-reconciliation-summary.json docs/implementation/generated/semantic-reconciliation-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/generated/expected-object-graph.json docs/implementation/generated/semantic-reconciliation.json docs/implementation/generated/semantic-reconciliation-summary.json
          if git diff --cached --quiet; then
            echo "Generated semantic artifacts are unchanged."
            exit 0
          fi
          git commit -m "docs: regenerate PostgreSQL AST graph and semantic reconciliation"
          git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main

      - name: Upload expected-object graph artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moreai-postgresql-ast-graph-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30

name: Phase 04 Sandbox Security Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/sandbox/**'
      - '.github/workflows/phase04-sandbox.yml'
  pull_request:
    paths:
      - 'apps/sandbox/**'
      - '.github/workflows/phase04-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sandbox test dependencies
        working-directory: apps/sandbox
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run sandbox and browser policy tests
        working-directory: apps/sandbox
        env:
          PYTHONPATH: .
        run: python -m pytest -q

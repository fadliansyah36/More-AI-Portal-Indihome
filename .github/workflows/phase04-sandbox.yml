name: Phase 04 Sandbox Security Tests
# Main-branch integration regression: worker recovery, customer/partner auth, provider failover, sandbox adapter, legacy route isolation.

on:
  push:
    branches: [main]
    paths:
      - 'apps/sandbox/**'
      - 'engine/**'
      - 'apps/worker/**'
      - '.github/workflows/phase04-sandbox.yml'
  pull_request:
    paths:
      - 'apps/sandbox/**'
      - 'engine/**'
      - 'apps/worker/**'
      - '.github/workflows/phase04-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sandbox test dependencies
        working-directory: apps/sandbox
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run sandbox and browser policy tests
        working-directory: apps/sandbox
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  engine-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine and pinned test dependencies
        working-directory: engine
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run OpenManus engine runtime and policy tests
        working-directory: engine
        env:
          PYTHONPATH: ..
        run: python -m pytest -q

  worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker and engine test dependencies
        working-directory: apps/worker
        run: python -m pip install --disable-pip-version-check -e '.[test]' -e '../../engine[test]'
      - name: Run durable worker, memory, and sandbox adapter tests
        working-directory: apps/worker
        env:
          PYTHONPATH: .:../..
        run: python -m pytest -q tests

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        working-directory: apps/api
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run FastAPI auth and tenant contract tests
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests

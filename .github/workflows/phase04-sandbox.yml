name: Phase 04 Sandbox Security Tests
# Main-branch integration regression: worker recovery, customer/partner auth, provider failover, sandbox adapter, legacy route isolation, privileged-role expiry and partner-wide membership precedence.

on:
  push:
    branches: [main]
    paths:
      - 'apps/sandbox/**'
      - 'engine/**'
      - 'apps/worker/**'
      - 'apps/api/**'
      - '.github/workflows/phase04-sandbox.yml'
  pull_request:
    paths:
      - 'apps/sandbox/**'
      - 'engine/**'
      - 'apps/worker/**'
      - '.github/workflows/phase04-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sandbox test dependencies
        working-directory: apps/sandbox
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run sandbox and browser policy tests
        working-directory: apps/sandbox
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  engine-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine and pinned test dependencies
        working-directory: engine
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run OpenManus engine runtime and policy tests
        working-directory: engine
        env:
          PYTHONPATH: ..
        run: python -m pytest -q

  worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker and engine test dependencies
        working-directory: apps/worker
        run: python -m pip install --disable-pip-version-check -e '.[test]' -e '../../engine[test]'
      - name: Run durable worker, memory, and sandbox adapter tests
        working-directory: apps/worker
        env:
          PYTHONPATH: .:../..
        run: python -m pytest -q tests

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        working-directory: apps/api
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run FastAPI auth and tenant contract tests
        working-directory: apps/api
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests


  browser-docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep browser and scanner base images immutable and version-compatible
      # with the pinned OpenFuse worker (Playwright 1.62.1).
      MOREAI_OPENFUSE_BASE_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      MOREAI_CLAMAV_IMAGE: clamav/clamav:1.5.5-debian@sha256:85f35b3eee903dbd96c5ca250c5aa13d230d97987c0f876f7d46f001f9414239
      MOREAI_BROWSER_ALLOWED_DOMAINS: example.com,httpbin.org
      MOREAI_BROWSER_SERVICE_TOKEN: ci-browser-service-token-0123456789abcdef
      MOREAI_BROWSER_PROXY_TOKEN: ci-browser-proxy-token-0123456789abcdef
      MOREAI_BROWSER_EGRESS_ENFORCED: "true"
      ALLOWLIST_TEST_URL: https://example.com/
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated browser and egress proxy images
        run: docker compose -f apps/sandbox/compose.browser.yml build
      - name: Start isolated browser network
        run: docker compose -f apps/sandbox/compose.browser.yml up -d
      - name: Wait for browser supervisor and proxy
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -f apps/sandbox/compose.browser.yml exec -T browser-egress-proxy python -c 'import socket; socket.create_connection(("browser-supervisor",8080),2).close()' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f apps/sandbox/compose.browser.yml ps
          docker compose -f apps/sandbox/compose.browser.yml logs --no-color
          exit 1
      - name: Build trusted worker client image
        run: docker build -f apps/worker/Dockerfile -t moreai-worker-browser-ci .
      - name: Verify worker-to-supervisor private network connectivity
        run: |
          docker run --rm --network sandbox_browser_isolated \
            -e MOREAI_BROWSER_SERVICE_TOKEN \
            --entrypoint python moreai-worker-browser-ci -c '
          import asyncio, os, httpx
          from apps.sandbox.app.browser_supervisor import BrowserSupervisor
          async def main():
              async with httpx.AsyncClient() as client:
                  supervisor = BrowserSupervisor(
                      service_url="http://browser-supervisor:8080",
                      service_token=os.environ["MOREAI_BROWSER_SERVICE_TOKEN"],
                      egress_enforced=True,
                      allow_private_http=True,
                      http=client,
                  )
                  result = await supervisor.check_ready()
                  assert result["status"] == "ready"
          asyncio.run(main())
          '
      - name: Verify IPv4 IPv6 isolation and authenticated proxy egress
        run: bash apps/sandbox/scripts/verify-browser-network-isolation.sh
      - name: Collect browser network diagnostics on failure
        if: failure()
        run: docker compose -f apps/sandbox/compose.browser.yml logs --no-color
      - name: Stop isolated browser network
        if: always()
        run: docker compose -f apps/sandbox/compose.browser.yml down --volumes --remove-orphans
